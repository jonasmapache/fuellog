{% extends "base.html" %}
{% block title %}{{ t('setup.title') }}{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">{{ icon('droplet') }}</div>
    <h1>{{ t('setup.heading') }}</h1>
    <p class="setup-intro">{{ t('setup.intro') }}</p>
    {% if error %}<p class="error">{{ t(error) }}</p>{% endif %}
    <form method="post" action="/setup">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>{{ t('setup.username') }}
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>{{ t('setup.password') }}
        <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>{{ t('setup.password_confirm') }}
        <input type="password" name="password_confirm" autocomplete="new-password" minlength="8" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">{{ t('setup.submit') }}</button>
    </form>
  </div>
</div>
{% endblock %}
